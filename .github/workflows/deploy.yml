name: Deploy EasyPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: easypanel-site-eduit
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/luanvillasboas14/eduit-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/eduit-site/visibility" \
            -f visibility=public

      - name: Trigger EasyPanel deployment
        env:
          WEBHOOK_URL: ${{ vars.EASYPANEL_WEBHOOK_SITE_EDUIT || secrets.EASYPANEL_WEBHOOK_SITE_EDUIT }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Defina EASYPANEL_WEBHOOK_SITE_EDUIT em Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail --silent --show-error --location --request POST "$WEBHOOK_URL"
          echo "Imagem publicada e deploy disparado no EasyPanel."
